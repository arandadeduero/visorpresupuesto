    <h1>Metodología y fuentes</h1>
    <p class="lead">De dónde salen los datos de esta web, cómo se han tratado y qué límites tienen.</p>

    <h2>De dónde salen los datos</h2>
    <p>Todas las cifras salen de los documentos del presupuesto que publica el Ayuntamiento de Aranda de Duero: hojas de Excel numeradas del anexo A1 al A13 (resumen por capítulos, estados de ingresos y de gastos, inversiones, subvenciones nominativas, estado de la deuda y carga financiera). Los ficheros originales, sin tocar, están en el <a href="https://github.com/arandadeduero/visorpresupuesto" rel="noopener">repositorio del proyecto</a>, en una carpeta por cada año. Un programa convierte cada Excel en los ficheros JSON que lee la web, y puedes bajarlos en <a href="descargas.html">Descargas</a>.</p>

    <h2>Presupuesto aprobado, no gasto ejecutado</h2>
    <p>Todo lo que ves aquí es el <strong>presupuesto aprobado</strong>: lo que el Ayuntamiento prevé ingresar y gastar durante el año, tal como se aprobó antes de que empezara. No es lo que se ha gastado de verdad. Durante el año el presupuesto se modifica, y lo realmente ingresado y gastado (la ejecución y la liquidación) puede ser distinto. Para ver cómo va la ejecución, consulta el <a href="https://transparencia.arandadeduero.es" rel="noopener">portal de transparencia del Ayuntamiento</a>.</p>

    <h2>Cómo se clasifican los ingresos y los gastos</h2>
    <p>Los ingresos y los gastos se agrupan en <strong>capítulos</strong> (clasificación económica: qué tipo de ingreso o de gasto es) y los gastos, además, en <strong>programas y políticas de gasto</strong> (clasificación por programas: para qué sirve). Es la estructura que obliga a seguir a las entidades locales la <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2008-19916" rel="noopener">Orden EHA/3565/2008</a>, modificada por la <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2014-2922" rel="noopener">Orden HAP/419/2014</a>. En la web cada capítulo se escribe como «Cap 6 - Obras e inversiones»: el número y un nombre corto; el nombre oficial aparece al pasar el ratón. Los términos están explicados en la <a href="guia.html">guía</a>.</p>

    <h2>Población</h2>
    <p>Las cifras «por habitante» dividen el importe entre la población de Aranda de Duero según el <a href="https://www.ine.es" rel="noopener">Instituto Nacional de Estadística (INE)</a>. Cada página de resumen indica de qué año es la población usada. Es una media: no es lo que paga cada vecino.</p>

    <h2>Estimaciones propias</h2>
    <p>El <strong>nivel de endeudamiento</strong> y el <strong>ahorro neto</strong> de la página de <a href="indicadores.html">indicadores</a> son estimaciones nuestras con las cifras del presupuesto aprobado y solo con los préstamos del anexo de deuda. Siguen la idea del <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a53" rel="noopener">artículo 53 del texto refundido de la Ley Reguladora de las Haciendas Locales</a>, pero no son los indicadores oficiales: esos salen de la liquidación del presupuesto y los calcula la Intervención municipal.</p>

    <h2>Cómo se actualiza</h2>
    <p>Cuando el Ayuntamiento publica un presupuesto, se añade su carpeta de Excel al repositorio, se convierten los datos y la web se publica de nuevo de forma automática. La fecha «Datos actualizados el…» que verás en el pie de cada página es la del último cambio en los datos de la web.</p>

    <h2>Textos pendientes de revisión</h2>
    <div class="aviso"><h3>Préstamos y remanentes de tesorería</h3>
      <p>Los textos de las páginas de <a href="deuda.html">deuda</a> e <a href="inversiones.html">inversiones</a> sobre los préstamos y los remanentes de tesorería están pendientes de que los revise el Ayuntamiento. Hasta entonces, léelos como una explicación orientativa. Las preguntas concretas están en <a href="https://github.com/arandadeduero/visorpresupuesto/blob/main/docs/revision/2026-10-19-textos-deuda-y-remanentes.md" rel="noopener">el documento de revisión</a>.</p></div>

    <h2>Cómo avisar de un error</h2>
    <p>Si ves una cifra que no cuadra con el Excel original o un texto que no se entiende, <a href="https://github.com/arandadeduero/visorpresupuesto/issues" rel="noopener">abre una incidencia en GitHub</a> indicando la página y el año. El código y los datos están en el <a href="https://github.com/arandadeduero/visorpresupuesto" rel="noopener">repositorio del proyecto</a>.</p>
