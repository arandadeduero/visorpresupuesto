name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # el build saca la fecha de los datos y el lastmod del sitemap del historial

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      # El build usa node: el HTML estático reutiliza el JS de la web (menú, pie, avisos, indicadores)
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: pip install -r requirements.txt

      - name: Construir dist/ con las huellas
        run: python tools/build_site.py

      - name: Tests del conversor y de la web (también sobre dist/)
        env:
          DIST_DIR: dist
        run: pytest -q

      - name: Los datos generados están al día y cuadran
        run: |
          for carpeta in [0-9][0-9][0-9][0-9]; do
            ls "$carpeta"/*.xlsx > /dev/null 2>&1 || continue
            salida=$(python tools/convert.py "$carpeta")
            echo "$salida"
            if echo "$salida" | grep -q AVISO; then
              echo "::error::Los totales de $carpeta no cuadran (ver AVISO arriba)"; exit 1
            fi
          done
          git diff --exit-code site/data

      - name: Tests de JavaScript
        run: node --test "site/js/*.test.js"
