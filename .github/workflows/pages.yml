name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Comprobar que la web publicada carga
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${URL%/}"
          for intento in $(seq 1 18); do
            if curl -fsS "$base/" | grep -q "Presupuestos de Aranda de Duero" \
              && curl -fsS "$base/data/index.json" | grep -q '"ultimo"' \
              && curl -fsS -o /dev/null "$base/vendor/chart.umd.min.js"; then
              echo "La web carga en $base"; exit 0
            fi
            echo "Intento $intento: todavía no responde, espero 10 s…"; sleep 10
          done
          echo "::error::La web no carga en $base"; exit 1
