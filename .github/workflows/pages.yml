name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fecha de los datos y lastmod del sitemap, del historial
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Construir dist/ con huella en los nombres de los ficheros
        run: python tools/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Comprobar que la web publicada carga
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${URL%/}"
          # Los nombres con huella salen del manifiesto del build
          css=$(python -c 'import json;print(json.load(open("dist/build-manifest.json"))["css/styles.css"])')
          js=$(python -c 'import json;print(json.load(open("dist/build-manifest.json"))["js/home.js"])')
          vendor=$(python -c 'import json;print(json.load(open("dist/build-manifest.json"))["vendor/chart.umd.min.js"])')
          datos=$(python -c 'import json;print(json.load(open("dist/build-manifest.json"))["data/"])')
          # Páginas de un año (el más antiguo publicado, que no es el último) y el alias del último año en la raíz; los años salen de los datos
          anio=$(python -c 'import json;m=json.load(open("dist/build-manifest.json"));i=json.load(open("dist/"+m["data/"]+"index.json"));print(min(a["anio"] for a in i["anios"]))')
          ultimo=$(python -c 'import json;m=json.load(open("dist/build-manifest.json"));print(json.load(open("dist/"+m["data/"]+"index.json"))["ultimo"])')
          for intento in $(seq 1 18); do
            if curl -fsS "$base/" | grep -q "Presupuestos de Aranda de Duero" \
              && curl -fsS "$base/" | grep -q "<h1>" \
              && curl -fsS "$base/sitemap.xml" | grep -q "<lastmod>" \
              && curl -fsS "$base/metodologia.html" | grep -q "<h1>Metodología y fuentes</h1>" \
              && curl -fsS "$base/" | grep -q "$js" \
              && curl -fsS "$base/$anio/gastos.html" | grep -q "<h1>.*$anio" \
              && curl -fsS "$base/$anio/gastos.html" | grep -q "rel=\"canonical\" href=\"[^\"]*/$anio/gastos.html\"" \
              && curl -fsS "$base/$anio/gastos.html" | grep -q "\.\./$css" \
              && curl -fsS "$base/$anio/" | grep -q "<h1>.*$anio" \
              && curl -fsS "$base/gastos.html" | grep -q "rel=\"canonical\" href=\"[^\"]*/$ultimo/gastos.html\"" \
              && curl -fsS "$base/sitemap.xml" | grep -q "/$anio/gastos.html" \
              && curl -fsS "$base/404.html" | grep -q "noindex" \
              && curl -fsS -o /dev/null "$base/${datos}$anio/gastos.json" \
              && curl -fsS -o /dev/null "$base/$css" \
              && curl -fsS -o /dev/null "$base/$js" \
              && curl -fsS -o /dev/null "$base/$vendor" \
              && curl -fsS "$base/${datos}index.json" | grep -q '"ultimo"'; then
              echo "La web carga en $base"; exit 0
            fi
            echo "Intento $intento: todavía no responde, espero 10 s…"; sleep 10
          done
          echo "::error::La web no carga en $base"; exit 1
